<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Design-a-thon</title>
    <link rel="icon" href="../assets/images/favicon/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <div id="first">
            <img id="favicon" src="../assets/images/favicon/favicon.png">
        </div>

        <button id="menu-button">
            ☰
        </button>
        <div id="menu">
            <div id="links-left">
                <a class="link" href="https://design-a-thon.com/home">Home</a>
                <a class="link" href="https://design-a-thon.com/events">Events</a>
                <a class="link" href="https://design-a-thon.com/shops">Shops</a>
                <a id="current-link" class="link" href="https://design-a-thon.com/ticket-tally">Ticket Tally</a>
            </div>
            <div id="links-right">
                <a class="link" href="https://design-a-thon.com/submit">Submit</a>
                <a class="link" href="https://design-a-thon.com/register">Register</a>
                <a class="link" href="https://design-a-thon.com/login">Login</a>
            </div>
        </div>

    </div>


    <button id="back-to-top" onclick="scrollToTop()">Back to Top</button>

    <div class="title"> Ticket Tally </div>
    
    <div class="container">
        <div class="refresh" id="last-updated">Last Updated: Unknown</div>
        <div class="quickfind">
            <input
                type="text"
                id="user-search"
                placeholder="Quick Find (Enter Username without @)"
            >
            <button onclick="goToUser()">Go</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th class = "user">User</th>
                    <th class="ticket">Tickets</th>
                </tr>
            </thead>
            <tbody id="leaderboard"></tbody>
        </table>
      
    </div>

  </body>
<script src="script.js"></script>
</html>
