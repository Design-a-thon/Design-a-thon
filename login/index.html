<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Design-a-thon</title>
    <link rel="icon" href="../assets/images/favicon/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">

        <div id="first">
            <img id="favicon" src="../assets/images/favicon/favicon.png">
        </div>

        <button id="menu-button">
            ☰
        </button>

        <div id="menu">
            <div id="links-left">
                <a class="link" href="https://design-a-thon.com/home">Home</a>
                <a class="link" href="https://design-a-thon.com/events">Events</a>
                <a class="link" href="https://design-a-thon.com/shops">Shops</a>
                <a class="link" href="https://design-a-thon.com/ticket-tally">Ticket Tally</a>
            </div>
            <div id="links-right">
                <a class="link" href="https://design-a-thon.com/submit">Submit</a>
                <a class="link" href="https://design-a-thon.com/register">Register</a>
                <a id="current-link" class="link" href="https://design-a-thon.com/login">Login</a>
            </div>
        </div>

    </div>

    <main class="login-container">

        <div class="login-card">

            <h1>Sign in to your Design-a-thon account.</h1>

            <form id="login-form">

                <div class="input-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <a href="#" class="forgot-password">
                    Forgot your password?
                </a>

                <button
                    type="submit"
                    class="login-button"
                >
                    Log In
                </button>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <button
                id="google-login"
                class="google-button"
            >

                <img
                    src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                    alt="Google Logo"
                >

                Continue with Google

            </button>

            <p class="register-link">
                Don't have an account?
                <a href="https://design-a-thon.com/register">
                    Register
                </a>
            </p>

        </div>

    </main>


    <div id="bottombar">

        <div id="footer-left">
            <p>© 2026 Design-a-thon</p>
        </div>

        <div id="footer-socials">
            <a href="https://scratch.mit.edu/users/Lemon24K/" class="social-link">Scratch</a>
            <a href="https://discord.gg/7tavFjgcrp" class="social-link">Discord</a>
            <a href="https://www.instagram.com/design_a_thon" class="social-link">Instagram</a>
            <a href="https://www.youtube.com/@Design-a-thon24K" class="social-link">YouTube</a>
        </div>

    </div>

</body>
<script type="module" src="script.js"></script>
</html>
