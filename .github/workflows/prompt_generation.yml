name: Update design prompts

on:
  workflow_dispatch:

# Allows the workflow to update files and push changes
permissions:
  contents: write

jobs:
  update-ticket-tally:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: python -m pip install --upgrade pip

# Allows python modules to load correctly
      - run: pip install -r requirements.txt
      - run: python generation.py

# Commits the updated design prompt files back to the repository
      - name: Commit updated design prompt files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/prompts/

          git diff --cached --quiet && exit 0
          
          git commit -m "Update design prompt files"
          git push